title = "Obsidian Agent MCP secret checks"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Obsidian Local REST API 的密钥为 64 位十六进制字符串。
[[rules]]
id = "obsidian-rest-api-key"
description = "Obsidian Local REST API key"
regex = '''(?i)(?:obsidian[_-]?(?:local[_-]?)?(?:rest[_-]?)?api[_-]?key)[\s"']{0,3}[:=][\s"']{0,3}([a-f0-9]{64})'''
secretGroup = 1
keywords = ["obsidian"]
