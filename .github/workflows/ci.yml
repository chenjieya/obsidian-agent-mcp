name: CI

"on":
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-checks:
    name: Secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install verified Gitleaks
        run: python scripts/install_gitleaks.py
      - name: Check current tracked files
        run: python scripts/check_secrets.py --staged
      - name: Check reachable commit history
        run: python scripts/check_secrets.py --history HEAD

  tests:
    name: Tests (${{ matrix.os }})
    needs: secret-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Install verified Gitleaks
        run: python scripts/install_gitleaks.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
      - name: Check dependencies
        run: python -m pip check
